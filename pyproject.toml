[tool.poetry]
name = "nonebot-adapter-dws"
version = "1.0.1a1"
description = "DingTalk DWS adapter for nonebot2"
authors = ["EeeMao <my1634325882@163.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://v2.nonebot.dev/"
repository = "https://github.com/EeeMaoY/adapter-dws"
documentation = "https://v2.nonebot.dev/"
keywords = ["bot", "dingtalk", "dws", "nonebot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Robot Framework",
  "Framework :: Robot Framework :: Library",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3"
]
packages = [
  { include = "nonebot" }
]
exclude = ["nonebot/__init__.py", "nonebot/adapters/__init__.py"]

[tool.poetry.dependencies]
python = "^3.9"
nonebot2 = "^2.5.0"
typing-extensions = ">=4.0"

[tool.poetry.dev-dependencies]
nonebot2 = { git = "https://github.com/nonebot/nonebot2.git", branch = "dev" }

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 80
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = ["typing_extensions"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
